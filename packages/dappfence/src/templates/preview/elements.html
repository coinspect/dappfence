<!doctype html>
<html lang="en">
    <head>
        <!-- @include ../partials/head.html title="DappFence elements" -->
    </head>
    <body>
        <!--
            Catalog of the small components, one section each. Buttons: every
            solid variant (button.css) without and with its icon
            (assets/icons/), then the security warning's danger button.
            Pills: the severity chip (badge.css) that reads "Blocked" on the
            security warning's header, shown on each variant's fill since it
            is translucent white. Switch (switch.css): off and on.
        -->
        <main class="df-elements">
            <h2 class="df-elements__title">Elements</h2>

            <section class="df-elements__section">
                <h3>Buttons</h3>
                <div class="df-elements__grid">
                    <code>brand</code>
                    <button class="df-btn df-btn--brand" type="button">Continue</button>
                    <button class="df-btn df-btn--brand" type="button">
                        <!-- @include ../assets/icons/shield.svg -->
                        Continue
                    </button>
                    <code>info</code>
                    <button class="df-btn df-btn--info" type="button">Learn more</button>
                    <button class="df-btn df-btn--info" type="button">
                        <!-- @include ../assets/icons/info.svg -->
                        Learn more
                    </button>
                    <code>warn</code>
                    <button class="df-btn df-btn--warn" type="button">Proceed anyway</button>
                    <button class="df-btn df-btn--warn" type="button">
                        <!-- @include ../assets/icons/warning.svg -->
                        Proceed anyway
                    </button>
                    <code>error</code>
                    <button class="df-btn df-btn--error" type="button">Block site</button>
                    <button class="df-btn df-btn--error" type="button">
                        <!-- @include ../assets/icons/error.svg -->
                        Block site
                    </button>
                </div>
            </section>

            <section class="df-elements__section">
                <h3>Danger button (security warning)</h3>
                <div class="df-elements__wide">
                    <button class="df-btn df-btn--danger" type="button">Unblock site</button>
                </div>
            </section>

            <section class="df-elements__section">
                <h3>Severity chip (security warning header)</h3>
                <div class="df-elements__fills">
                    <div class="df-elements__fill" style="--df-elements-fill: var(--df-brand)">
                        <span class="df-severity-chip">{{t:warning.chip}}</span>
                        <code>brand</code>
                    </div>
                    <div class="df-elements__fill" style="--df-elements-fill: var(--df-info)">
                        <span class="df-severity-chip">{{t:warning.chip}}</span>
                        <code>info</code>
                    </div>
                    <div class="df-elements__fill" style="--df-elements-fill: var(--df-warn)">
                        <span class="df-severity-chip">{{t:warning.chip}}</span>
                        <code>warn</code>
                    </div>
                    <div class="df-elements__fill" style="--df-elements-fill: var(--df-error)">
                        <span class="df-severity-chip">{{t:warning.chip}}</span>
                        <code>error</code>
                    </div>
                </div>
            </section>

            <section class="df-elements__section">
                <h3>Switch</h3>
                <div class="df-elements__switches">
                    <input
                        class="df-switch__input"
                        type="checkbox"
                        role="switch"
                        id="df-switch-off"
                    />
                    <label class="df-switch" for="df-switch-off">
                        <span>Off</span>
                        <span class="df-switch__track" aria-hidden="true"></span>
                    </label>
                    <input
                        class="df-switch__input"
                        type="checkbox"
                        role="switch"
                        id="df-switch-on"
                        checked
                    />
                    <label class="df-switch" for="df-switch-on">
                        <span>On</span>
                        <span class="df-switch__track" aria-hidden="true"></span>
                    </label>
                </div>
            </section>
        </main>
    </body>
</html>
